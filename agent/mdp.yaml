# @package agent
_target_: agent.mdp.MaskedDPAgent
name: mdp
obs_shape: ??? # to be specified later
action_shape: ??? # to be specified later
device: ${device}
lr: 1e-4
use_tb: ${use_tb}
batch_size: 384 # Batch size Table 2
mask_ratio: [0.15, 0.35, 0.55, 0.75, 0.95]
transformer_cfg:
  # Hparams from paper (Table 2)
  # Jitter
  traj_lengths: [8, 16, 32, 64]
  jitter_strategy: 'mix50'
  traj_length: 64           # context length

  n_embd: 256               # hidden dim
  n_head: 4                 # attention heads
  n_enc_layer: 3            # encoder layers
  n_dec_layer: 2            # decoder layers

  # Modality Dropout  
  modality_dropout: true
  modality_dropout_prob: 0.60
  action_dropout_prob: 1.0
  state_dropout_prob: 0.0
  min_keep_states: 1
  min_keep_actions: 0

  # Visual
  use_pixel_obs: false
  pixel_obs_shape: [64, 64, 3]
  pixel_encoder_type: drqv2     # 'drqv2' (trainable) or 'resnet_frozen' (legacy)
  freeze_encoder_after: 10000
  pretrained_encoder_path: "/home/bmancilla/archive/MaskDP/pretrained_encoders/drqbc_64px_convnet.pt"

  # Regularization dropout: ONE knob feeds attn/resid/mlp (same mechanism as Procgen)
  dropout: 0
  attn_pdrop: ${agent.transformer_cfg.dropout}
  resid_pdrop: ${agent.transformer_cfg.dropout}
  mlp_pdrop: ${agent.transformer_cfg.dropout}
  embd_pdrop: 0
  # Decoupled AdamW weight decay (2D matrices only).
  weight_decay: 0
  pe: 'fixed'
  loss: 'total'
  norm: 'l2'