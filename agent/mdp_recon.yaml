# agent/mdp_recon.yaml
_target_: agent.mdp_recon.ReconstructionEvalAgent

# Total sequence length used during evaluation
T: 64

# Masking scheme to apply.
#   "second_half" : mask last T//2 timesteps (both states + actions)
#                   Best for interpretable per-position curves
#   "random"      : random masking on 2T interleaved sequence (like training)
#                   mask_ratio drawn uniformly from the list below
masking_scheme: second_half

# Candidate mask ratios — only used when masking_scheme="random"
mask_ratio:
  - 0.15
  - 0.35
  - 0.55
  - 0.75
  - 0.95

# Modality to evaluate.
#   "actions" : action reconstruction loss only (W&B: maskdp-mm-vd4rl-action-recon)
#   "states"  : state  reconstruction loss only (W&B: maskdp-mm-vd4rl-state-recon)
#   "both"    : both losses, single forward pass per episode, logs to both projects
modality: both

# Snapshot path
path: null