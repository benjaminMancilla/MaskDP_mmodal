# agent/mdp_recon_procgen.yaml
_target_: agent.mdp_recon.ReconstructionEvalAgent

# Total sequence length used during evaluation
T: 64

# Masking scheme to apply.
#   "second_half" : mask last T//2 timesteps (both states + actions)
#                   Best for interpretable per-position curves
#   "random"      : random masking on 2T interleaved sequence (like training)
#                   mask_ratio drawn uniformly from the list below
#   "temporal_split" : flexible generalisation of second_half with configurable ratio
#                      keep the first `split_ratio` fraction of timesteps visible,
#                      mask the remaining (1 - split_ratio) fraction
#   "last_action"     : same split_ratio knob as temporal_split, but also reveals
#                       the last visible state and masks/scores ONLY the action
#                       at that position. matches the closed-loop BCT protocol

masking_scheme: second_half

# Candidate mask ratios — only used when masking_scheme="random"
mask_ratio:
  - 0.15
  - 0.35
  - 0.55
  - 0.75
  - 0.95

# Visible fraction for temporal_split — only used when masking_scheme="temporal_split".
# Must be in (0, 1]
split_ratio: 0.5

# Modality to evaluate.
#   "actions" : action reconstruction metric only (accuracy if discrete, MSE if continuous)
#   "states"  : state reconstruction MSE only
#   "both"    : both metrics, single forward pass per episode
modality: actions

obs_type: pixels
frame_stack: 1

# Procgen convention: no dummy first frame, action[t] aligned with obs[t].
has_dummy_transition: false

# Procgen episodes have variable length and are frequently shorter than T.
# Default "off" keeps this eval script's original behavior (skip short
# episodes); switch to "on" to also evaluate them (padded, same as training), or
# "force" to evaluate ONLY the padded ones and check the padding path in isolation.
#   "off"   (default) : skip episodes with real_length < T entirely.
#   "on"    : zero-pad short episodes to T and evaluate them alongside long ones.
#   "force" : ONLY evaluate short (padded) episodes.
padding_mode: "off"

# Snapshot path
path: null