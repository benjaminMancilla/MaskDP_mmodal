defaults:
  - agent: mdp_procgen
  - override hydra/launcher: submitit_local
  - _self_

# task settings
task: coinrun
discount: 0.99

# no live environment
# this is pure offline pretraining.
use_live_env: false

# dataset convention
has_dummy_transition: false

# train settings
num_grad_steps: 400010
log_every_steps: 1000

# eval DISABLED
eval_every_steps: 25000
num_eval_episodes: 10
use_return_eval: false
goal_buffer_dir: null

# Return validation - Procgen eval
use_bct_eval: false
bct_env_name: ${task}
bct_distribution_mode: easy
bct_eval_episodes: 50        
bct_eval_every_epochs: 5     # 1 epoch = 1000000 / batch_size steps
bct_eval_K: null             # null -> uses transformer_cfg.traj_length (full context window)
bct_eval_temperature: 1.0
bct_eval_sample: true
bct_splits:
  train:
    start_level: 0
    num_levels: 200
  val:
    start_level: 200
    num_levels: 50
  test:
    start_level: 250
    num_levels: 0

steps_per_epoch: null

# Early stopping
early_stop: false
early_stop_wait_evals: 20        # number of pacience checks
early_stop_min_delta: 0.1
early_stop_strict: true
# resume Early stopping
early_stop_init_best_return: null  # manual override
early_stop_init_waited_evals: 0    # manual override

# snapshot
snapshots: [0, 5000, 10000, 25000, 50000, 75000, 100000, 125000, 150000, 175000, 200000, 250000, 300000, 350000, 400000]
snapshot_dir: /home/bmancilla/archive/MaskDP/maskdp_snapshots_procgen/

# resume
resume: false
resume_dir: none
resume_step: 0

# dataset TRAIN
use_raw_replay_dir: true
replay_buffer_dir: /path/to/your/procgen/dataset  # AJUSTAR antes de correr
replay_buffer_size: 2000000
replay_buffer_num_workers: 16
batch_size: ${agent.batch_size}
train_file_split: "all"
train_ratio: 0.8   # unused when file_split="all", kept for the assertion in OfflineReplayBuffer
eval_ratio: 0.1
bc_ratio: 0.1

# pixel observation
obs_type: pixels
frame_stack: 1

# misc
seed: 1
device: cuda
save_video: false   # no live env to render from anyway
use_tb: true
use_wandb: true
project: maskdp-mm-procgen
notes: "pretrain procgen coinrun, offline-only (no live env), discrete actions"
exp_name: procgen_coinrun_placeholder

hydra:
  run:
    dir: /home/bmancilla/scratch/maskdp_runs/${now:%Y.%m.%d}/${now:%H%M%S}_${agent.name}_${task}