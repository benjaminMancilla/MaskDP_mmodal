defaults:
  - agent: bc_pixel
  - override hydra/launcher: submitit_local
  - _self_

# task
task: cheetah_run
discount: 0.99
obs_type: pixels
pixel_size: 64

# pretrained MaskDP snapshot (REQUIRED)
pretrain_path: ???

# BC finetuning data — split bc (10%)
replay_buffer_dir: /home/bmancilla/archive/MaskDP/v_d4rl_data/main/cheetah_run/expert/64px
replay_buffer_size: 100000
replay_buffer_num_workers: 4
batch_size: 64
train_ratio: 0.8
eval_ratio: 0.1
bc_ratio: 0.1

# training
num_grad_steps: 50000
log_every_steps: 500
eval_every_steps: 5000
num_eval_episodes: 10

# snapshots
snapshots: [10000, 25000, 50000]
snapshot_dir: /home/bmancilla/archive/maskdp_snapshots_vd4rl/bc

# misc
seed: 1
device: cuda
use_tb: true
use_wandb: true
project: maskdp-mm-vd4rl-bc
notes: "BC finetuning pixel obs cheetah"
exp_name: bc_vd4rl_frozen_encoder